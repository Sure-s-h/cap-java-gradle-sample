# SonarQube scanner configuration.
#
# The scanner runs as a standalone CLI (not via the Gradle Sonar plugin), so it
# cannot discover the Gradle layout on its own. Without sonar.java.binaries it
# aborts:
#   "Your project contains .java files, please provide compiled classes with
#    sonar.java.binaries property"
#
# This means the Static Analysis stage MUST run after a successful build in the
# same workspace - build/classes/java/main has to exist before the scanner
# starts.
#
# NOTE the paths differ from the Maven sample:
#   Gradle  build/classes/java/main      build/test-results/test
#   Maven   srv/target/classes           srv/target/surefire-reports
#
# sonar.projectKey, sonar.projectName, sonar.host.url, sonar.token and
# sonar.exclusions are supplied by the pipeline on the command line and
# deliberately not set here (CLI arguments take precedence anyway).

sonar.sources=srv/src/main/java
sonar.tests=srv/src/test/java

# Compiled output produced by 'gradle test' or 'gradle build'
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# JUnit results - note this is NOT the Maven surefire-reports path
sonar.junit.reportPaths=build/test-results/test

# JaCoCo coverage, written by the jacocoTestReport task
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

sonar.java.source=21
sonar.sourceEncoding=UTF-8

# gen/ holds CDS compiler output, not hand-written code. It sits outside
# sonar.sources above, so it is never analysed.
