plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    // Provisions Node itself, so the build does not depend on the build image
    // shipping Node. This is the Gradle equivalent of the cds-maven-plugin
    // 'install-node' goal used by the Maven sample.
    id 'com.github.node-gradle.node' version '7.1.0'
}

import com.github.gradle.node.npm.task.NpxTask

group = 'com.releaseowl.sample'
version = '1.0.0-SNAPSHOT'

ext {
    cdsServicesVersion = '5.1.1'
    springBootVersion = '4.1.1'
    // Pipeline verification switch: -Dsample.failtest=true forces a test failure
    sampleFailTest = System.getProperty('sample.failtest', 'false')
}

repositories {
    mavenCentral()
}

// CAP's project layout keeps the service module under srv/, so the standard
// Gradle source directories are remapped rather than duplicating the layout.
sourceSets {
    main {
        java { srcDirs = ['srv/src/main/java'] }
        // 'cds build --for java' writes CSN and EDMX under gen/ in a non-Maven
        // project, so that directory is a second resource root.
        resources { srcDirs = ['srv/src/main/resources', 'gen/srv/src/main/resources'] }
    }
    test {
        java { srcDirs = ['srv/src/test/java'] }
        resources { srcDirs = ['srv/src/test/resources'] }
    }
}

dependencies {
    implementation platform("com.sap.cds:cds-services-bom:${cdsServicesVersion}")
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    implementation 'com.sap.cds:cds-starter-spring-boot'
    runtimeOnly 'com.sap.cds:cds-adapter-odata-v4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// CDS model compilation.
//
// SAP publishes no Gradle plugin for CAP Java - cds-maven-plugin has no Gradle
// equivalent - so the CDS compiler (a Node tool) is driven directly here.
//
// Node is downloaded by the node-gradle plugin rather than taken from the build
// image. Piper's gradleExecuteBuild step runs on gradle:8-jdk21, which has
// Gradle and a JDK but no Node, and no public image ships Gradle + JDK 21 +
// Node together. Downloading Node keeps the build independent of the image.
// ---------------------------------------------------------------------------

node {
    download = true
    version = '22.12.0'
    // Overridable for agents that mirror the Node distributions internally.
    distBaseUrl = findProperty('nodeDistBaseUrl') ?: 'https://nodejs.org/dist'
    workDir = file("${layout.buildDirectory.get()}/nodejs")
    npmWorkDir = file("${layout.buildDirectory.get()}/npm")
}

tasks.register('cdsBuild', NpxTask) {
    description = 'Compiles the CDS model into CSN and EDMX for the Java runtime'
    group = 'cds'
    dependsOn 'npmInstall'
    command = 'cds'
    args = ['build', '--for', 'java']
    inputs.files(fileTree('srv') { include '**/*.cds' })
    inputs.file('package.json')
    outputs.dir('gen')
}

tasks.named('processResources') {
    dependsOn 'cdsBuild'
    // 'cds build' also copies application.yaml into gen/, duplicating the
    // authoritative copy under srv/. EXCLUDE keeps the first root's copy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The Spring Boot plugin also emits a small '-plain' jar alongside the
// executable one. Only the executable jar is deployable, and two jars would
// make a build-result glob ambiguous, so the plain jar is switched off.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    // Forwarded into the test JVM; the probe also honours SAMPLE_FAILTEST from the environment.
    systemProperty 'sample.failtest', sampleFailTest
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Coverage for SonarQube. The report is bound to 'test' so a plain
// 'gradle test' produces it, not only 'gradle build'.
jacoco {
    toolVersion = '0.8.13'
}

tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('clean') {
    doLast {
        delete 'srv/src/main/resources/edmx'
        delete 'gen'
    }
}
